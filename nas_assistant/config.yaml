name: NAS Assistant
version: "0.28.0"
slug: nas_assistant
description: Your family cloud, at home. A private space for every Home Assistant user, on a disk you choose
url: https://github.com/ovlas/nas-assistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8456
panel_icon: mdi:harddisk
panel_title: NAS Assistant
# Every family member sees the panel, not only HA admins.
panel_admin: false
# The home network itself: smart TVs find the DLNA media server (UDP 1900 multicast,
# port 8200) only there. The web UI and the API stay on port 8456, as before; other
# add-ons (e.g. Cloudflared) still reach it by its hostname.
host_network: true
homeassistant_api: true
# Only to read /network/info: the home IP address goes in the pairing QR (Android does not resolve .local names).
hassio_api: true
udev: true
# The NAS disk is normally picked in the "device" option: the Supervisor then
# grants access to that disk only, and protection mode can stay on.
# full_access is used only with protection mode off, so the setup wizard can
# list and read every disk.
full_access: true
# ntfs-3g fallback for NTFS disks.
devices:
  - /dev/fuse
privileged:
  - SYS_ADMIN
  # Disk health: SMART goes through ATA pass-through commands, which Linux allows only
  # with raw I/O rights (and only on the whole disks given in smart_devices).
  - SYS_RAWIO
apparmor: false
# NAS data lives on the dedicated disk (/nas), never in /data:
# Home Assistant backups stay small and on the main disk.
backup_exclude:
  - "*/cache/*"
options:
  disk: ""
  family_folder_name: Family
  trash_days: 30
  backup_time: "03:00"
  backup_keep_days: 30
  log_level: info
  dlna: false
  smart_devices: []
schema:
  device: device(subsystem=block)?
  disk: str?
  family_folder_name: str
  trash_days: int(0,365)
  backup_device: device(subsystem=block)?
  storage_device: device(subsystem=block)?
  backup_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  backup_keep_days: int(1,365)
  public_url: url?
  log_level: list(debug|info|warning|error)
  dlna: bool?
  # Whole disks, only to read their health (SMART): with protection mode on the add-on
  # otherwise gets just the partitions it uses. Set from the Disks page.
  smart_devices:
    - device(subsystem=block)
