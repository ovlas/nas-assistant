configuration:
  device:
    name: NAS-Festplattengerät
    description: "Wähle die Partition der NAS-Festplatte (endet auf -part1, -part2…). Empfohlen: funktioniert mit aktivem Schutzmodus. Starte das Add-on nach einer Änderung neu."
  disk:
    name: NAS-Festplatte (erweitert)
    description: "UUID oder Bezeichnung der Festplatte. Nur nötig, wenn du oben oder in der Oberfläche kein Gerät wählst."
  family_folder_name:
    name: Name des geteilten Ordners
    description: Name des Ordners, der mit der ganzen Familie geteilt wird.
  trash_days:
    name: "Tage in „Zuletzt gelöscht“"
    description: "Gelöschte Objekte werden nach so vielen Tagen endgültig entfernt. 0 behält sie, bis du den Papierkorb leerst."
  backup_device:
    name: "Backup-Festplatte"
    description: "Optionale zweite Festplatte: Jede Nacht wird die NAS-Festplatte in ihren Ordner „NAS Assistant Backup“ kopiert. Sonst wird nichts angefasst."
  backup_time:
    name: "Backup-Uhrzeit"
    description: "Wann das nächtliche Backup startet (HH:MM)."
  backup_keep_days:
    name: "Alte Versionen behalten (Tage)"
    description: "Wie lange frühere Versionen geänderter oder gelöschter Dateien aufbewahrt werden."
  public_url:
    name: "Öffentliche Adresse"
    description: "Adresse von NAS Assistant von unterwegs, z. B. https://nas.beispiel.de (ein Cloudflare-Tunnel-Host auf Port 8456). Wird beim Verbinden eines Telefons angezeigt."
  dlna:
    name: Fernseher im Haus (DLNA)
    description: "Teilt den Bereich Familie mit den Smart-TVs im Heimnetz (nur lesen, nie private Bereiche)."
  log_level:
    name: Protokollstufe
    description: Wie ausführlich das Add-on protokolliert.
