configuration:
  device:
    name: NAS disk device
    description: "Pick the partition of the NAS disk (it ends in -part1, -part2…). Recommended: it works with protection mode on. Restart the add-on after changing it."
  disk:
    name: NAS disk (advanced)
    description: "UUID or label of the disk. Only needed if you don't pick a device above or in the interface."
  family_folder_name:
    name: Shared folder name
    description: Name of the folder shared with the whole family.
  trash_days:
    name: "Days in Recently deleted"
    description: "Deleted items are erased for good after this many days. 0 keeps them until you empty the trash."
  backup_device:
    name: "Backup disk"
    description: "Optional second disk: every night the NAS disk is copied into its \"NAS Assistant Backup\" folder. Nothing else on it is touched."
  backup_time:
    name: "Backup time"
    description: "When the nightly backup runs (HH:MM)."
  backup_keep_days:
    name: "Keep old versions (days)"
    description: "How long previous versions of changed or deleted files are kept on the backup disk."
  public_url:
    name: "Public address"
    description: "Address of NAS Assistant from outside home, e.g. https://nas.example.com (a Cloudflare Tunnel host pointing to port 8456). Shown when you connect a phone."
  log_level:
    name: Log level
    description: How much detail the add-on writes to its log.
network:
  8456/tcp: API for the mobile apps (LAN / Tailscale)
