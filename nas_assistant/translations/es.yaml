configuration:
  device:
    name: Dispositivo del disco NAS
    description: "Elige la partición del disco NAS (termina en -part1, -part2…). Recomendado: funciona con el modo de protección activado. Reinicia el complemento después de cambiarlo."
  disk:
    name: Disco NAS (avanzado)
    description: "UUID o etiqueta del disco. Solo hace falta si no eliges un dispositivo arriba o en la interfaz."
  family_folder_name:
    name: Nombre de la carpeta compartida
    description: Nombre de la carpeta compartida con toda la familia.
  trash_days:
    name: "Días en Eliminado recientemente"
    description: "Los elementos eliminados se borran para siempre tras estos días. 0 los guarda hasta que vacíes la papelera."
  log_level:
    name: Nivel de registro
    description: Cuánto detalle escribe el complemento en su registro.
network:
  8456/tcp: API para las apps móviles (LAN / Tailscale)
