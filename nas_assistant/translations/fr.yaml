configuration:
  device:
    name: Périphérique du disque NAS
    description: "Choisissez la partition du disque NAS (elle se termine par -part1, -part2…). Recommandé : fonctionne avec le mode protection activé. Redémarrez le module après l'avoir changé."
  disk:
    name: Disque NAS (avancé)
    description: "UUID ou étiquette du disque. Utile seulement si vous ne choisissez pas de périphérique ci-dessus ou dans l'interface."
  family_folder_name:
    name: Nom du dossier partagé
    description: Nom du dossier partagé avec toute la famille.
  trash_days:
    name: "Jours dans Supprimés récemment"
    description: "Les éléments supprimés sont effacés définitivement après ce nombre de jours. 0 les garde jusqu'à ce que vous vidiez la corbeille."
  backup_device:
    name: "Disque de sauvegarde"
    description: "Second disque facultatif : chaque nuit le disque du NAS est copié dans son dossier « NAS Assistant Backup ». Le reste n'est pas touché."
  backup_time:
    name: "Heure de sauvegarde"
    description: "Heure de la sauvegarde nocturne (HH:MM)."
  backup_keep_days:
    name: "Garder les anciennes versions (jours)"
    description: "Durée de conservation des versions précédentes des fichiers modifiés ou supprimés."
  public_url:
    name: "Adresse publique"
    description: "Adresse de NAS Assistant depuis l'extérieur, ex. https://nas.exemple.com (un hôte du tunnel Cloudflare vers le port 8456). Affichée quand vous connectez un téléphone."
  dlna:
    name: TV de la maison (DLNA)
    description: "Partage l'espace Famille avec les smart TV du réseau de la maison (lecture seule, jamais les espaces privés)."
  log_level:
    name: Niveau de journalisation
    description: Niveau de détail écrit par le module dans son journal.
