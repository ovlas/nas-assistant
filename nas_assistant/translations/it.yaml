configuration:
  device:
    name: Dispositivo disco NAS
    description: "Scegli la partizione del disco NAS (finisce con -part1, -part2…). Consigliato: funziona con la modalità protetta attiva. Riavvia l'add-on dopo averla cambiata."
  disk:
    name: Disco NAS (avanzato)
    description: "UUID o etichetta del disco. Serve solo se non scegli un dispositivo qui sopra o dall'interfaccia."
  family_folder_name:
    name: Nome cartella condivisa
    description: Nome della cartella condivisa con tutta la famiglia.
  trash_days:
    name: "Giorni in Eliminati di recente"
    description: "Gli elementi eliminati vengono cancellati definitivamente dopo questi giorni. 0 li tiene finché non svuoti il cestino."
  backup_device:
    name: "Disco di backup"
    description: "Secondo disco facoltativo: ogni notte il disco del NAS viene copiato nella sua cartella \"NAS Assistant Backup\". Il resto del disco non viene toccato."
  backup_time:
    name: "Orario del backup"
    description: "Quando parte il backup notturno (HH:MM)."
  backup_keep_days:
    name: "Conserva versioni precedenti (giorni)"
    description: "Per quanto tempo restano sul disco di backup le versioni precedenti dei file modificati o cancellati."
  public_url:
    name: "Indirizzo pubblico"
    description: "Indirizzo di NAS Assistant da fuori casa, es. https://nas.esempio.com (un host del tunnel Cloudflare che punta alla porta 8456). Compare quando colleghi un telefono."
  log_level:
    name: Livello log
    description: Quanti dettagli l'add-on scrive nel log.
network:
  8456/tcp: API per le app mobili (LAN / Tailscale)
