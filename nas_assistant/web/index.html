<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NAS Assistant</title>
  <link rel="icon" href="logo.svg?v={{version}}" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v={{version}}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="logo.svg?v={{version}}" alt=""><span>NAS Assistant</span></div>
    <nav id="nav">
      <button class="nav-item nav-home" data-space="personal" data-view="home"><i data-icon="home"></i><span class="l" data-i18n="home"></span><span class="s" data-i18n="home"></span></button>
      <div class="nav-group" data-i18n="mySpace"></div>
      <button class="nav-item" data-space="personal" data-view="photos"><i data-icon="photos"></i><span class="l" data-i18n="photos"></span><span class="s" data-i18n="photos"></span></button>
      <button class="nav-item" data-space="personal" data-view="files"><i data-icon="folder"></i><span class="l" data-i18n="files"></span><span class="s" data-i18n="files"></span></button>
      <button class="nav-item nav-collections" data-space="personal" data-view="collections"><i data-icon="album"></i><span class="l" data-i18n="collections"></span><span class="s" data-i18n="collections"></span></button>
      <button class="nav-item nav-trash" data-space="personal" data-view="trash"><i data-icon="trash"></i><span class="l" data-i18n="recentlyDeleted"></span><span class="s" data-i18n="recentlyDeletedShort"></span></button>
      <div class="nav-group" data-i18n="family"></div>
      <button class="nav-item" data-space="family" data-view="photos"><i data-icon="family"></i><span class="l" data-i18n="familyPhotos"></span><span class="s" data-i18n="familyShort"></span></button>
      <button class="nav-item" data-space="family" data-view="files"><i data-icon="share"></i><span class="l" data-i18n="sharedFiles"></span><span class="s" data-i18n="sharedShort"></span></button>
      <div class="nav-group nav-admin" data-i18n="system" hidden></div>
      <button class="nav-item nav-admin nav-disks" data-space="personal" data-view="disks" hidden><i data-icon="disk"></i><span class="l" data-i18n="disksTitle"></span><span class="s" data-i18n="disksTitle"></span></button>
      <button class="nav-item nav-admin" data-space="disk" data-view="files" hidden><i data-icon="folder"></i><span class="l" data-i18n="diskFiles"></span><span class="s" data-i18n="diskFilesShort"></span></button>
    </nav>
    <!-- Like Music Assistant: the way back to Home Assistant, and the collapse toggle under it -->
    <button class="ha-pill" id="ha-menu" data-i18n-title="haMenu" hidden><i data-icon="haLogo"></i><span>Home Assistant</span></button>
    <div class="collapse-row"><button class="icon-btn" id="collapse" data-i18n-title="collapse"><i data-icon="sidebar"></i></button></div>
    <div class="side-footer">
      <div class="disk-card">
        <div class="disk-row"><i data-icon="disk"></i><span id="disk-label" data-i18n="diskLoading"></span></div>
        <div class="bar"><div class="bar-fill" id="disk-bar"></div></div>
      </div>
      <div class="user" id="user"></div>
    </div>
  </aside>

  <button class="ha-fab" id="ha-menu-fab" data-i18n-title="haMenu" hidden><i data-icon="haLogo"></i></button>
  <main id="main">
    <div class="disk-banner" id="disk-banner" hidden></div>
    <header class="topbar" id="topbar">
      <div class="titles">
        <h1 id="title"></h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="actions" id="actions">
        <button class="btn" id="sort-btn" data-i18n-title="sortBy" hidden></button>
        <div class="segmented layout-switch" id="layout-switch">
          <button data-layout="list" data-i18n-title="layoutList"><i data-icon="layoutList"></i></button>
          <button data-layout="icons" data-i18n-title="layoutIcons"><i data-icon="layoutIcons"></i></button>
          <button data-layout="grid" data-i18n-title="layoutGrid"><i data-icon="layoutGrid"></i></button>
        </div>
        <button class="btn" id="tv-btn" hidden><i data-icon="tv"></i><span data-i18n="onTv"></span></button>
        <button class="btn" id="new-folder"><i data-icon="plus"></i><span data-i18n="newFolder"></span></button>
        <button class="btn danger" id="empty-trash" hidden><i data-icon="trash"></i><span data-i18n="emptyTrash"></span></button>
        <label class="btn" id="folder-btn" data-i18n-title="uploadFolder"><i data-icon="folder"></i><span data-i18n="uploadFolderShort"></span><input type="file" id="folder-input" webkitdirectory multiple hidden></label>
        <label class="btn primary" id="upload-btn"><i data-icon="upload"></i><span data-i18n="upload"></span><input type="file" id="file-input" multiple hidden></label>
      </div>
    </header>
    <nav class="chips" id="chips"></nav>
    <nav class="crumbs" id="crumbs"></nav>

    <section id="home" class="home" hidden></section>
    <section id="disks" class="disks" hidden></section>
    <section id="collections" class="collections" hidden></section>
    <section id="gallery" class="gallery"></section>
    <section id="files" class="file-list"></section>
    <div class="empty" id="empty" hidden>
      <img src="logo.svg" alt="">
      <h2 id="empty-title"></h2>
      <p id="empty-text"></p>
    </div>

    <section class="setup" id="setup" hidden>
      <img class="setup-logo" src="logo.svg" alt="">
      <h1 data-i18n="setupTitle"></h1>
      <p class="lead" id="setup-lead" data-i18n="setupLead"></p>
      <div class="disk-list" id="disk-list"></div>
      <button class="btn" id="disk-refresh" data-i18n="refresh"></button>
    </section>

    <div class="drop-hint"><i data-icon="upload"></i><span data-i18n="dropHint"></span></div>
  </main>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-bar">
      <button class="icon-btn" id="v-close" data-i18n-title="close"><i data-icon="close"></i></button>
      <div class="viewer-info"><div id="v-date"></div><div class="viewer-name" id="v-name"></div></div>
      <button class="icon-btn" id="v-tv" data-i18n-title="watchOnTv"><i data-icon="tv"></i></button>
      <a class="icon-btn" id="v-download" data-i18n-title="downloadOriginal"><i data-icon="download"></i></a>
      <button class="icon-btn" id="v-fav"></button>
      <button class="icon-btn" id="v-album" data-i18n-title="addToCollection"><i data-icon="album"></i></button>
      <button class="icon-btn" id="v-rename" data-i18n-title="rename"><i data-icon="rename"></i></button>
      <button class="icon-btn" id="v-delete" data-i18n-title="moveToTrash"><i data-icon="trash"></i></button>
    </div>
    <div class="viewer-stage" id="v-stage"></div>
    <button class="nav-arrow left" id="v-prev" data-i18n-title="previous"><i data-icon="left"></i></button>
    <button class="nav-arrow right" id="v-next" data-i18n-title="next"><i data-icon="right"></i></button>
  </div>

  <section class="upload-panel" id="upload-panel" hidden></section>

  <div class="menu" id="menu" hidden></div>
  <div class="snack" id="snack" hidden><span id="snack-text"></span><button id="snack-action"></button></div>

  <dialog id="move-dialog" class="move-dialog">
    <h2 id="move-title"></h2>
    <div class="segmented" id="move-spaces">
      <button data-space="personal" data-i18n="mySpace"></button>
      <button data-space="family" data-i18n="family"></button>
    </div>
    <nav class="crumbs" id="move-crumbs"></nav>
    <div class="pick-list" id="move-list"></div>
    <div class="dialog-actions">
      <button class="btn" id="move-cancel" data-i18n="cancel"></button>
      <button class="btn primary" id="move-ok" data-i18n="moveHere"></button>
    </div>
  </dialog>

  <dialog id="device-dialog" class="device-dialog"></dialog>
  <dialog id="collection-dialog" class="move-dialog"></dialog>
  <dialog id="tv-dialog" class="move-dialog"></dialog>
  <div class="snack tv-bar" id="tv-bar" hidden><i data-icon="tv"></i><span id="tv-bar-text"></span><button id="tv-stop" data-i18n="stop"></button></div>

  <dialog id="format-dialog">
    <form method="dialog">
      <h2 data-i18n="formatTitle"></h2>
      <p id="format-text"></p>
      <p id="format-word"></p>
      <input id="format-confirm" autocomplete="off">
      <div class="dialog-actions">
        <button class="btn" value="cancel" data-i18n="cancel"></button>
        <button class="btn danger" value="ok" data-i18n="formatAndUse"></button>
      </div>
    </form>
  </dialog>
  <script src="i18n.js?v={{version}}"></script>
  <script src="app.js?v={{version}}"></script>
</body>
</html>
