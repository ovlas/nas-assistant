<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Same house as the Music Assistant icon (color #58B9ED, 45° roof, proportions),
       with a white hard disk inside instead of the "MA" letters. -->
  <g transform="translate(256 256) scale(1.085) translate(-256 -270)">
    <path d="M256 66 L450 260 Q466 276 466 298 L466 474 L46 474 L46 298 Q46 276 62 260 Z"
          fill="#58B9ED" stroke="#58B9ED" stroke-width="44" stroke-linejoin="round"/>
    <!-- hard disk (white, portrait) -->
    <rect x="148" y="232" width="216" height="236" rx="34" fill="#fff"/>
    <!-- screws -->
    <circle cx="177" cy="261" r="9" fill="#58B9ED"/>
    <circle cx="335" cy="261" r="9" fill="#58B9ED"/>
    <circle cx="177" cy="439" r="9" fill="#58B9ED"/>
    <!-- platter with a data track -->
    <circle cx="256" cy="333" r="72" fill="#58B9ED"/>
    <circle cx="256" cy="333" r="45" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6"/>
    <circle cx="256" cy="333" r="14" fill="#fff"/>
    <!-- read head arm from the bottom-right pivot -->
    <path d="M306 434 L271 360" stroke="#58B9ED" stroke-width="30" stroke-linecap="round"/>
    <path d="M306 434 L271 360" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
    <circle cx="306" cy="434" r="20" fill="#58B9ED"/>
    <circle cx="306" cy="434" r="8" fill="#fff"/>
  </g>
</svg>
